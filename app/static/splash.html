:root { --bg: #080b14; --accent: #ff4f3a; --accent-2: #ff7a5c; --teal: #36d1c4; --text: #e8eef9; --dim: #8b9bb8; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'SplashFont', 'Segoe UI', sans-serif; font-weight: 700;
  user-select: none; cursor: default;
}
body { display: grid; place-items: center; transition: opacity 350ms ease-out; }
body.fade-out { opacity: 0; }

/* ── Warp starfield: three layers of streaks flying outwards ─── */
.space { position: fixed; inset: 0; overflow: hidden; perspective: 600px; }
.space::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(60vmin 60vmin at 50% 50%, rgba(255,79,58,.16), transparent 70%),
    radial-gradient(120vmin 90vmin at 80% 10%, rgba(54,209,196,.08), transparent 60%);
}
.star {
  position: absolute; left: 50%; top: 50%; width: .35vmin; height: .35vmin; border-radius: 50%;
  background: #fff; opacity: 0;
  animation: warp var(--d, 2.4s) linear var(--delay, 0s) infinite;
}
@keyframes warp {
  0%   { opacity: 0; transform: rotate(var(--a)) translateX(2vmin) scaleX(1); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(95vmin) scaleX(14); }
}

/* ── Centre piece ─────────────────────────────────────────────── */
.splash { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3.2vmin; }
.core { position: relative; width: 26vmin; height: 26vmin; display: grid; place-items: center; animation: core-in .8s cubic-bezier(.2,1.1,.3,1) both; }
@keyframes core-in { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }

.ring { position: absolute; inset: 0; border-radius: 50%; border: .35vmin solid transparent; }
.ring.r1 { border-top-color: var(--accent); border-right-color: rgba(255,79,58,.25); animation: spin 2.2s linear infinite; }
.ring.r2 { inset: 3vmin; border-bottom-color: var(--teal); border-left-color: rgba(54,209,196,.25); animation: spin 3.1s linear infinite reverse; }
.ring.r3 { inset: 6vmin; border: .2vmin dashed rgba(232,238,249,.22); animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.diamond {
  width: 9vmin; height: 9vmin; transform: rotate(45deg);
  background: linear-gradient(135deg, #ff9a7a, var(--accent) 45%, #9c1b13);
  box-shadow: 0 0 5vmin rgba(255,79,58,.75), inset 0 0 0 .3vmin rgba(255,230,220,.75);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: rotate(45deg) scale(1);    box-shadow: 0 0 4vmin rgba(255,79,58,.6),  inset 0 0 0 .3vmin rgba(255,230,220,.75); }
  50%      { transform: rotate(45deg) scale(1.09); box-shadow: 0 0 8vmin rgba(255,79,58,.95), inset 0 0 0 .3vmin rgba(255,230,220,.95); }
}

.title { font-size: clamp(24px, 6vmin, 58px); letter-spacing: .32em; margin-right: -.32em; animation: rise .7s ease-out .25s both; }
.subtitle { font-size: clamp(11px, 1.9vmin, 17px); letter-spacing: .3em; color: var(--dim); margin-top: -2vmin; animation: rise .7s ease-out .4s both; }
@keyframes rise { from { opacity: 0; transform: translateY(1.2em); letter-spacing: .6em; } to { opacity: 1; transform: none; } }

.status { font-size: clamp(11px, 1.8vmin, 16px); letter-spacing: .22em; color: var(--accent-2); animation: rise .6s ease-out .6s both; }
.status i { display: inline-block; width: .5em; height: .5em; margin-left: .3em; background: var(--accent-2); animation: blink 1.1s steps(1, end) infinite; }
.status i:nth-child(2) { animation-delay: .18s; } .status i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 100% { opacity: .15; } 35% { opacity: 1; } }

.scan { width: min(60vmin, 420px); height: .5vmin; min-height: 3px; background: rgba(255,255,255,.08); overflow: hidden; border-radius: 3px; animation: rise .6s ease-out .7s both; }
.scan i { display: block; width: 35%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent), var(--teal), transparent); animation: sweep 1.5s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(300%); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } .star { display: none; } }
</style>
</head>
<body>
  <div class="space" id="space" aria-hidden="true"></div>
  <div class="splash" role="status" aria-live="polite">
    <div class="core" aria-hidden="true">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <div class="diamond"></div>
    </div>
    <div class="title">NMS TRACKER</div>
    <div class="subtitle">SHADOWSKEEP LLC &middot; v1.0.0</div>
    <div class="status">INITIALISING<i></i><i></i><i></i></div>
    <div class="scan"><i></i></div>
  </div>
  <script>
    // Deterministic starfield so every launch looks the same
    (function () {
      var host = document.getElementById('space'), seed = 7;
      function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      for (var n = 0; n < 90; n++) {
        var s = document.createElement('span');
        s.className = 'star';
        s.style.setProperty('--a', (rnd() * 360).toFixed(1) + 'deg');
        s.style.setProperty('--d', (1.4 + rnd() * 2.4).toFixed(2) + 's');
        s.style.setProperty('--delay', (-rnd() * 3).toFixed(2) + 's');
        host.appendChild(s);
      }
    })();
    // Called from the Qt host right before navigating to the app.
    window.fadeOut = function () { document.body.classList.add('fade-out'); };
  </script>
</body>
</html>
